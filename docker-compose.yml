# OneView production Docker stack
# Start: docker compose up -d

services:
  postgres:
    image: postgres:16-alpine
    container_name: oneview-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: oneview
    ports:
      # Host 15432 avoids local Windows PostgreSQL (often 5432/5433)
      - "15432:5432"
    volumes:
      - oneview_pgdata:/var/lib/postgresql/data
      - oneview_pgbackups:/backups
    networks:
      - backend-network
      - database-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d oneview"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: oneview-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - oneview_redis:/data
    networks:
      - backend-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/Dockerfile
      args:
        APP_NAME: oneview-api
    container_name: oneview-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_PORT: 3001
      DATABASE_URL: postgresql://admin:admin@postgres:5432/oneview?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-oneview-dev-jwt-secret-change-me}
      JWT_EXPIRES_SECONDS: ${JWT_EXPIRES_SECONDS:-28800}
      HMAC_PEPPER: ${HMAC_PEPPER:-oneview-dev-pepper-change-me}
      STORAGE_ROOT: /data/files
      CORS_ORIGIN: http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173,http://127.0.0.1:4173,http://localhost
      MAIL_DRY_RUN: "false"
      MAIL_PROVIDER: smtp
      MAIL_FROM: ${MAIL_FROM:-noreply@oneview.local}
      MAIL_SMTP_HOST: mailpit
      MAIL_SMTP_PORT: "1025"
      MAIL_SMTP_SECURE: "false"
      MAIL_SMTP_USER: ${MAIL_SMTP_USER:-}
      MAIL_SMTP_PASS: ${MAIL_SMTP_PASS:-}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://127.0.0.1:5173}
    volumes:
      - oneview_files:/data/files
      - oneview_logs:/var/log/oneview
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
    networks:
      - backend-network
      - database-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  mailpit:
    image: axllent/mailpit:v1.21
    container_name: oneview-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - backend-network

  worker:
    build:
      context: .
      dockerfile: apps/Dockerfile
      args:
        APP_NAME: oneview-worker
    container_name: oneview-worker
    restart: unless-stopped
    environment:
      NODE_ENV: production
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://admin:admin@postgres:5432/oneview?schema=public
      MAIL_DRY_RUN: "true"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    networks:
      - backend-network
      - database-network

  nginx:
    image: nginx:1.27-alpine
    container_name: oneview-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    networks:
      - backend-network

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: oneview-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@acme.io
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    volumes:
      - oneview_pgadmin:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - database-network

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: oneview-prometheus
    restart: unless-stopped
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - oneview_prometheus:/prometheus
    ports:
      - "9090:9090"
    networks:
      - monitoring-network
      - backend-network

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: oneview-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin
      RABBITMQ_DEFAULT_VHOST: /
    ports:
      - "5672:5672"
      - "5552:5552"
      - "15672:15672"
    volumes:
      - oneview_rabbitmq:/var/lib/rabbitmq
      - ./infra/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
      - ./infra/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    networks:
      - backend-network
      - monitoring-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  grafana:
    image: grafana/grafana:11.2.0
    container_name: oneview-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      # Allow unsigned community plugins (e.g. RabbitMQ) if installed via UI
      GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS: maormil-rabbitmq-datasource
    ports:
      - "3000:3000"
    volumes:
      - oneview_grafana:/var/lib/grafana
    depends_on:
      - prometheus
      - rabbitmq
    networks:
      - monitoring-network
      - backend-network

  loki:
    image: grafana/loki:3.1.1
    container_name: oneview-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"
    volumes:
      - oneview_loki:/loki
    networks:
      - monitoring-network

networks:
  backend-network:
  database-network:
  monitoring-network:

volumes:
  oneview_pgdata:
  oneview_pgbackups:
  oneview_redis:
  oneview_files:
  oneview_logs:
  oneview_pgadmin:
  oneview_prometheus:
  oneview_grafana:
  oneview_loki:
  oneview_rabbitmq:
