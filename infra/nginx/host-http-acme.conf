# Host Nginx — HTTP only, named host (prep for Certbot --nginx)
# Use this BEFORE the first certificate request so server_name matches DNS.
#
#   DOMAIN=warin.example.com
#   sudo sed "s/DOMAIN/${DOMAIN}/g" infra/nginx/host-http-acme.conf \
#     | sudo tee /etc/nginx/sites-available/warin
#   sudo ln -sf /etc/nginx/sites-available/warin /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo mkdir -p /var/www/certbot
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d DOMAIN
#
# After Certbot succeeds, either keep Certbot-managed site or switch to
# host-https.conf (replace DOMAIN) — see docs/https-letsencrypt.md.

server {
  listen 80 default_server;
  listen [::]:80 default_server;
  server_name DOMAIN;

  root /opt/warin/shared/web;
  index index.html;

  client_max_body_size 25m;

  server_tokens off;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  location ^~ /.well-known/acme-challenge/ {
    default_type "text/plain";
    root /var/www/certbot;
  }

  location /api/ {
    proxy_pass http://127.0.0.1:8080/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/docs {
    proxy_pass http://127.0.0.1:8080/api/docs;
    proxy_set_header Host $host;
  }

  location /healthz {
    proxy_pass http://127.0.0.1:8080/healthz;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
