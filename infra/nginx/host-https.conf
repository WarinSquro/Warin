# Host Nginx — Warin SPA + API over HTTPS (Let's Encrypt)
#
# Prerequisites: DNS A/AAAA for DOMAIN → this server; SG/UFW allow 80 + 443.
# Full guide: docs/https-letsencrypt.md
#
# Install (after certbot issued certs for DOMAIN):
#   1. Replace DOMAIN below with your hostname (e.g. warin.example.com)
#   2. sudo cp infra/nginx/host-https.conf /etc/nginx/sites-available/warin
#   3. sudo ln -sf /etc/nginx/sites-available/warin /etc/nginx/sites-enabled/
#   4. sudo nginx -t && sudo systemctl reload nginx
#
# Preferred first-time path: keep host-ip / HTTP site with server_name DOMAIN,
# then run: sudo certbot --nginx -d DOMAIN
# Certbot will enable TLS + redirect; this file is the reproducible end state.
#
# SPA: /opt/warin/shared/web
# API (Compose nginx): 127.0.0.1:8080

# ── HTTP: ACME challenge + redirect to HTTPS ───────────────────────────────
server {
  listen 80;
  listen [::]:80;
  server_name DOMAIN;

  # Let's Encrypt HTTP-01 (certbot webroot or renewals)
  location ^~ /.well-known/acme-challenge/ {
    default_type "text/plain";
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

# ── HTTPS: SPA + API proxy ─────────────────────────────────────────────────
server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name DOMAIN;

  # Issued by Certbot — paths under /etc/letsencrypt/live/DOMAIN/
  ssl_certificate     /etc/letsencrypt/live/DOMAIN/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/DOMAIN/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  root /opt/warin/shared/web;
  index index.html;

  client_max_body_size 25m;

  server_tokens off;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  location /api/ {
    proxy_pass http://127.0.0.1:8080/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/docs {
    proxy_pass http://127.0.0.1:8080/api/docs;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /healthz {
    proxy_pass http://127.0.0.1:8080/healthz;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
