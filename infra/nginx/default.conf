# Compose nginx — API gateway only (SPA is host Nginx → /opt/warin/shared/web).
# 127.0.0.11 is Docker embedded DNS. Re-resolve so a recreated `api` container
# is not stuck on a stale IP (that shows up as 502 on :8080 / login).

server {
  listen 80;
  server_name _;

  client_max_body_size 25m;

  resolver 127.0.0.11 valid=10s ipv6=off;

  location /api/ {
    set $oneview_api http://api:3001;
    proxy_pass $oneview_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Required for employee Allowed IP login checks (Express trusts private proxy hops).
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/docs {
    set $oneview_api http://api:3001;
    proxy_pass $oneview_api;
    proxy_set_header Host $host;
  }

  location /healthz {
    return 200 'ok';
    add_header Content-Type text/plain;
  }
}
