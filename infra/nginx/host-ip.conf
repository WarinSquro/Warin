# Host Nginx — Warin SPA + API proxy (IP access, no TLS)
# Install on EC2:
#   sudo cp infra/nginx/host-ip.conf /etc/nginx/sites-available/warin
#   sudo ln -sf /etc/nginx/sites-available/warin /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Replace PUBLIC_IP in comments only — server_name _ accepts any Host (IP or later domain).
# SPA files: /opt/warin/shared/web  (vite dist)
# Compose nginx (API): 127.0.0.1:8080

server {
  listen 80 default_server;
  listen [::]:80 default_server;
  server_name _;

  root /opt/warin/shared/web;
  index index.html;

  client_max_body_size 25m;

  # Basic hardening (HTTP; tighten further when TLS is enabled)
  server_tokens off;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  location /api/ {
    proxy_pass http://127.0.0.1:8080/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/docs {
    proxy_pass http://127.0.0.1:8080/api/docs;
    proxy_set_header Host $host;
  }

  location /healthz {
    proxy_pass http://127.0.0.1:8080/healthz;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
